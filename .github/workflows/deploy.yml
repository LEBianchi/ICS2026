name: CI/CD - Pruebas, Build y Deploy a Azure App Service

on:
  push:
    branches: [development, main, 'test/**']
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: grupoics
  IMAGE_NAME: ics-backend

jobs:
  # ==============================================================
  # JOB 1: Quality Gate. Compila y corre TODAS las pruebas.
  # ==============================================================
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el codigo
        uses: actions/checkout@v4

      - name: 2. Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 3. Restaurar paquetes
        run: dotnet restore Dsw2025Tpi.sln

      - name: 4. Compilar
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: 5. Pruebas unitarias
        run: dotnet test tests/Dsw2025Tpi.UnitTests --configuration Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: 6. Pruebas de integracion y E2E
        run: dotnet test tests/Dsw2025Tpi.IntegrationTests --configuration Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: 7. Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx

      - name: 8. Avisar que el despliegue queda bloqueado
        if: failure()
        run: |
          echo "## Quality Gate fallido" >> $GITHUB_STEP_SUMMARY
          echo "Fallo al menos una prueba automatizada. El job build-and-deploy NO se ejecuta." >> $GITHUB_STEP_SUMMARY
          echo "::error title=Quality Gate::Fallaron pruebas automatizadas. Se bloquea la imagen Docker y el despliegue."

  # ==============================================================
  # JOB 2: Imagen Docker y despliegue a Azure.
  # needs: solo arranca si run-tests termino en verde.
  # ==============================================================
  build-and-deploy:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el codigo
        uses: actions/checkout@v4

      - name: 2. Construir la imagen Docker
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            .

      - name: 3. Iniciar sesion en Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Subir la imagen a Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Desplegar en Azure App Service
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}